# Acadia-HQ — full deployment stack.
#
# Stateful services (postgres, minio, redis, keycloak) are also declared here
# so a single `docker compose up` brings up the whole HQ. Production requires
# secrets to be supplied via the environment (see app/config.py — the services
# fail closed unless ACADIAHQ_ENV=production and real secrets are set).
#
# Usage:  docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# T-P34 (HQ-011): third-party images are pinned by digest (a tag can be
# re-pointed upstream); secrets have no defaults — compose refuses to start
# until the env file supplies them.
name: acadiahq

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${ACADIAHQ_DB_USER:-acadiahq}
      POSTGRES_PASSWORD: ${ACADIAHQ_DB_PASSWORD:?set ACADIAHQ_DB_PASSWORD}
      POSTGRES_DB: ${ACADIAHQ_DB_NAME:-acadiahq}
    volumes:
      - acadiahq-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ACADIAHQ_S3_ACCESS_KEY:-acadiahq}
      MINIO_ROOT_PASSWORD: ${ACADIAHQ_S3_SECRET_KEY:?set ACADIAHQ_S3_SECRET_KEY}
    volumes:
      - acadiahq-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &api-env
      ACADIAHQ_ENV: ${ACADIAHQ_ENV:-production}
      # T-P34: was ${ACADIAQ_DB_*} (missing "H") — a real DB password set for
      # postgres never reached the API.
      ACADIAHQ_DATABASE_URL: postgresql+asyncpg://${ACADIAHQ_DB_USER:-acadiahq}:${ACADIAHQ_DB_PASSWORD:?set ACADIAHQ_DB_PASSWORD}@postgres:5432/${ACADIAHQ_DB_NAME:-acadiahq}
      ACADIAHQ_REDIS_URL: redis://redis:6379/0
      ACADIAHQ_S3_ENDPOINT_URL: http://minio:9000
      ACADIAHQ_S3_ACCESS_KEY: ${ACADIAHQ_S3_ACCESS_KEY:-acadiahq}
      ACADIAHQ_S3_SECRET_KEY: ${ACADIAHQ_S3_SECRET_KEY:?set ACADIAHQ_S3_SECRET_KEY}
      ACADIAHQ_S3_BUCKET: ${ACADIAHQ_S3_BUCKET:-acadiahq}
      ACADIAHQ_OIDC_ISSUER: ${ACADIAHQ_OIDC_ISSUER:?set ACADIAHQ_OIDC_ISSUER}
      ACADIAHQ_OIDC_CLIENT_ID: ${ACADIAHQ_OIDC_CLIENT_ID:-acadiahq-api}
      ACADIAHQ_OIDC_CLIENT_SECRET: ${ACADIAHQ_OIDC_CLIENT_SECRET:?set ACADIAHQ_OIDC_CLIENT_SECRET}
      ACADIAHQ_SESSION_SECRET_KEY: ${ACADIAHQ_SESSION_SECRET_KEY:?set ACADIAHQ_SESSION_SECRET_KEY}
      ACADIAHQ_CORS_ALLOW_ORIGINS: ${ACADIAHQ_CORS_ALLOW_ORIGINS:?set ACADIAHQ_CORS_ALLOW_ORIGINS (JSON list of https origins)}
      # T-P34 (HQ-003/004): the https origin HQ is served from (OIDC redirect).
      ACADIAHQ_PUBLIC_BASE_URL: ${ACADIAHQ_PUBLIC_BASE_URL:?set ACADIAHQ_PUBLIC_BASE_URL}
      # T-P13 (F09): Ed25519 key signing device configuration (mounted below).
      ACADIAHQ_CONFIGURATION_SIGNING_KEY_PATH: /etc/acadiahq/keys/config-signing.pem
      # T-P34 (HQ-030): gateway TLS (mount ./tls). Without these the gateway
      # refuses to start in production.
      ACADIAHQ_GATEWAY_TLS_CERT_PATH: ${ACADIAHQ_GATEWAY_TLS_CERT_PATH:-/etc/acadiahq/tls/gateway.crt}
      ACADIAHQ_GATEWAY_TLS_KEY_PATH: ${ACADIAHQ_GATEWAY_TLS_KEY_PATH:-/etc/acadiahq/tls/gateway.key}
    volumes: &api-volumes
      - ./keys:/etc/acadiahq/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${ACADIAHQ_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m gateway.server
    environment: *api-env
    volumes:
      - ./keys:/etc/acadiahq/keys:ro
      - ./tls:/etc/acadiahq/tls:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ACADIAHQ_GATEWAY_PORT:-50051}:50051"
    # T-P12 (F10): AgentLink TLS. Mount the gateway certificate/key (and,
    # for mTLS, the device-CA bundle) and point the gateway settings at them;
    # devices dial https://<host>:50051 with the HQ CA pinned at
    # /etc/acadia/hq-ca.pem (provisioned alongside the endpoint, P-A10).
    # In production the gateway refuses to start without TLS (T-P34,
    # HQ-030). Optional mTLS: add ACADIAHQ_GATEWAY_TLS_CLIENT_CA_PATH.

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${ACADIAHQ_WEB_PORT:-8080}:80"

volumes:
  acadiahq-pg-data:
  acadiahq-minio-data:
