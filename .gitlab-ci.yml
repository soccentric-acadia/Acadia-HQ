workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages: [check]

variables:
  ACADIAHQ_TEST_DATABASE_URL: postgresql+asyncpg://acadiahq:acadiahq@postgres/acadiahq_test
  ACADIAHQ_DATABASE_URL: postgresql+asyncpg://acadiahq:acadiahq@postgres/acadiahq
  ACADIAHQ_S3_ENDPOINT_URL: http://localhost:9000

services:
  - name: postgres:16-alpine
    alias: postgres
    variables:
      POSTGRES_DB: acadiahq
      POSTGRES_USER: acadiahq
      POSTGRES_PASSWORD: acadiahq

check:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends make python3 python3-venv python3-pip nodejs npm
    - make install
  script:
    - make lint
    - make test
    - make build
