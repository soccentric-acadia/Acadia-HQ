name: CI

on:
  push:
    branches: [master, develop, "release/**"]
  pull_request:
    branches: [master, develop]

env:
  ACADIAHQ_TEST_DATABASE_URL: postgresql+asyncpg://acadiahq:acadiahq@postgres/acadiahq_test
  ACADIAHQ_DATABASE_URL: postgresql+asyncpg://acadiahq:acadiahq@postgres/acadiahq
  ACADIAHQ_S3_ENDPOINT_URL: http://localhost:9000

jobs:
  api-gateway:
    name: API + agent-gateway (lint, test, migrations)
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acadiahq
          POSTGRES_PASSWORD: acadiahq
          POSTGRES_DB: acadiahq
        options: >-
          --health-cmd pg_isready -U acadiahq
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl
      - name: Create test database
        run: |
          until pg_isready -h postgres -U acadiahq -d acadiahq >/dev/null 2>&1; do sleep 1; done
          PGPASSWORD=acadiahq createdb -h postgres -U acadiahq acadiahq_test || true
      - name: Install API + gateway (editable, dev)
        run: |
          pip install --upgrade pip
          pip install -e "api[dev]"
          pip install -e "agent-gateway[dev]"
      - name: Lint (ruff)
        run: |
          ruff check api
          ruff check agent-gateway
      - name: Run migrations
        run: alembic -c alembic.ini upgrade head
        env:
          ACADIAHQ_DATABASE_URL: postgresql+asyncpg://acadiahq:acadiahq@postgres/acadiahq
      - name: Test API
        run: cd api && python -m pytest -q
      - name: Test agent-gateway
        run: cd agent-gateway && python -m pytest -q

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-24.04
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-npm-${{ hashFiles('web/package-lock.json') }}
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run type-check
      - name: Build
        working-directory: web
        run: npm run build
